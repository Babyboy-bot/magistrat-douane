# ─────────────────────────────────────────────────────────────────────────────
# Nginx — Configuration production ACS Magistrat-Douane
# Remplacer : YOUR_DOMAIN, /path/to/staticfiles, /path/to/media
# ─────────────────────────────────────────────────────────────────────────────

upstream django_backend {
    server 127.0.0.1:8000;   # Daphne (ASGI)
    keepalive 32;
}

upstream nextjs_frontend {
    server 127.0.0.1:3000;   # Next.js
    keepalive 32;
}

# Redirection HTTP → HTTPS
server {
    listen 80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # ── SSL ──
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Sécurité ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Taille des requêtes (uploads documents) ──
    client_max_body_size 20M;

    # ── Gzip ──
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # ── Fichiers statiques Django ──
    location /static/ {
        alias /path/to/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Fichiers media (PRIVÉS : pièces d'identité, RIB, documents) ──
    # Ne JAMAIS utiliser `alias` ici : les media passent par Django qui
    # exige une authentification (voir protected_media_view dans config/urls.py).
    location /media/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSockets (Django Channels) ──
    location /ws/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # ── API Backend Django ──
    location /api/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;

        # Rate limiting API (configurer zone dans http block)
        # limit_req zone=api burst=20 nodelay;
    }

    # ── Admin Django ──
    location /acs-backoffice/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Restreindre aux IPs internes si souhaité
        # allow 192.168.0.0/16; deny all;
    }

    # ── Frontend Next.js ──
    location / {
        proxy_pass http://nextjs_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ── Health check (pas de log) ──
    location = /api/health/ {
        proxy_pass http://django_backend;
        access_log off;
    }
}
