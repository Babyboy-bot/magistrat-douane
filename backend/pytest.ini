[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
testpaths = core/tests accounts/tests magistassur/tests tests
addopts = -v --tb=short --cov=core --cov=accounts --cov=magistassur --cov-report=term-missing --cov-fail-under=60
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
