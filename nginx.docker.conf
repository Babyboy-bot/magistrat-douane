upstream django_backend {
    server backend:8000;
    keepalive 16;
}

upstream nextjs_frontend {
    server frontend:3000;
    keepalive 16;
}

# Résolution DNS dynamique Docker (re-résout si un container change d'IP)
resolver 127.0.0.11 valid=10s ipv6=off;

# IP réelle du client transmise par Caddy (seul point d'entrée public) : sans ça,
# tous les visiteurs auraient l'IP de Caddy → rate limit et filtre admin faussés.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 10.0.0.0/8;
real_ip_header X-Forwarded-For;

# Protocole d'origine (https) posé par Caddy, à défaut celui de nginx.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Rate limiting zones
# auth : 5 req/s max par IP (login, register, reset)
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
# api : 30 req/s max par IP pour le reste de l'API
limit_req_zone $binary_remote_addr zone=api:20m rate=30r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

    # ── Security headers ──
    add_header X-Content-Type-Options        "nosniff"                                              always;
    add_header X-Frame-Options               "DENY"                                                 always;
    add_header Referrer-Policy               "strict-origin-when-cross-origin"                      always;
    add_header Permissions-Policy            "camera=(), microphone=(), geolocation=()"             always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' ws: wss:; frame-ancestors 'none';" always;

    # ── Bloquer Swagger/OpenAPI en prod ──
    location ~* ^/api/(schema|docs|redoc)(/|$) {
        return 403;
    }

    location /static/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /media/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    location /ws/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 86400s;
    }

    # Endpoints auth : limite stricte anti-brute-force
    location ~* ^/api/auth/(login|register|password-reset) {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location /acs-backoffice/ {
        # Restreindre l'accès admin aux IPs locales uniquement
        allow 127.0.0.1;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        deny all;

        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    location = /api/health/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        access_log off;
    }

    location / {
        proxy_pass http://nextjs_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
