services:

  # ── PostgreSQL ──
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-magistrat_douane}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis (Channels + Cache) ──
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Backend Django / Gunicorn+Uvicorn ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    # ALLOWED_HOSTS / CSRF_TRUSTED_ORIGINS / CORS_ALLOWED_ORIGINS viennent du .env
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      # Caddy redirige déjà HTTP → HTTPS ; Django ne doit pas le refaire
      SECURE_SSL_REDIRECT: "False"
      BEHIND_HTTPS_PROXY: "True"
      WEB_CONCURRENCY: "3"
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Worker (tâches async : emails, exports) ──
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
    command: celery -A config worker --loglevel=info --concurrency=4
    volumes:
      - media_files:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Backup PostgreSQL + médias CNI/RIB (toutes les 24h, rétention 7 jours) ──
  # ⚠ Les sauvegardes restent sur le serveur : les copier aussi hors du serveur.
  db_backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${DB_USER:-postgres}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME:-magistrat_douane}
    volumes:
      - db_backups:/backups
      - media_files:/media:ro
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "while true; do
        STAMP=$$(date +%Y%m%d_%H%M%S);
        pg_dump | gzip > /backups/backup_$$STAMP.sql.gz;
        tar czf /backups/media_$$STAMP.tar.gz -C /media .;
        echo \"Backup: base + médias $$STAMP\";
        find /backups \\( -name '*.sql.gz' -o -name 'media_*.tar.gz' \\) -mtime +7 -delete;
        sleep 86400;
      done"

  # ── Celery Beat (tâches périodiques) ──
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Frontend Next.js ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE: ""
      HOSTNAME: 0.0.0.0
    depends_on:
      - backend

  # ── Caddy : seul point d'entrée public, HTTPS automatique (Let's Encrypt) ──
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nginx

  # ── Nginx reverse proxy (interne, uniquement joignable par Caddy) ──
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  media_files:
  static_files:
  db_backups:
  caddy_data:
  caddy_config:
